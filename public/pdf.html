
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NORCET</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #525659;
      font-family: Arial, sans-serif;
    }

    #toolbar {
      height: 52px;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      background: #202124;
      color: white;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: #3c4043;
      color: white;

      min-width: 42px;
      padding: 8px 12px;

      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    #pageInfo {
      min-width: 80px;
      text-align: center;
      font-size: 14px;
    }

    #viewer {
      position: absolute;
      top: 52px;
      left: 0;
      right: 0;
      bottom: 0;

      overflow: auto;
      padding: 15px 5px 30px;

      text-align: center;
      -webkit-overflow-scrolling: touch;
    }

    canvas {
      display: block;
      margin: 0 auto 15px;

      background: white;

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    #loading {
      color: white;
      padding-top: 30px;
    }

    #error {
      display: none;

      max-width: 500px;
      margin: 30px auto;
      padding: 20px;

      color: white;
      background: #8b0000;
      border-radius: 8px;

      line-height: 1.5;
    }

    @media (max-width: 600px) {

      #toolbar {
        height: 50px;
        gap: 4px;
      }

      button {
        min-width: 38px;
        padding: 7px 9px;
      }

      #pageInfo {
        min-width: 65px;
        font-size: 13px;
      }

      #viewer {
        top: 50px;
        padding: 10px 3px 25px;
      }
    }
  </style>
</head>

<body>

  <div id="toolbar">

    <button id="prev">‹</button>

    <span id="pageInfo">
      <span id="currentPage">1</span>
      /
      <span id="totalPages">-</span>
    </span>

    <button id="next">›</button>

    <button id="zoomOut">−</button>

    <button id="zoomIn">+</button>

  </div>


  <div id="viewer">

    <div id="loading">
      Loading PDF...
    </div>

    <div id="error"></div>

  </div>


  <script type="module">

    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


    /*
      Your local PDF
    */
    const PDF_URL = "/norcet.pdf";


    /*
      PDF.js worker
    */
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


    const viewer =
      document.getElementById("viewer");

    const loading =
      document.getElementById("loading");

    const errorBox =
      document.getElementById("error");

    const currentPageText =
      document.getElementById("currentPage");

    const totalPagesText =
      document.getElementById("totalPages");

    const prevButton =
      document.getElementById("prev");

    const nextButton =
      document.getElementById("next");

    const zoomInButton =
      document.getElementById("zoomIn");

    const zoomOutButton =
      document.getElementById("zoomOut");


    let pdf = null;

    let currentPage = 1;

    let scale = 1;


    /*
      Render a single page
    */
    async function renderPage(pageNumber) {

      const page =
        await pdf.getPage(pageNumber);


      const viewport =
        page.getViewport({
          scale: scale
        });


      const canvas =
        document.createElement("canvas");


      const context =
        canvas.getContext("2d");


      canvas.width =
        viewport.width;

      canvas.height =
        viewport.height;


      viewer.appendChild(canvas);


      await page.render({

        canvasContext: context,

        viewport: viewport

      }).promise;

    }


    /*
      Render PDF
    */
    async function renderPDF() {

      viewer.innerHTML = "";

      for (
        let i = 1;
        i <= pdf.numPages;
        i++
      ) {

        await renderPage(i);

      }

      updatePageInfo();

    }


    /*
      Page counter
    */
    function updatePageInfo() {

      currentPageText.textContent =
        currentPage;

      totalPagesText.textContent =
        pdf.numPages;

    }


    /*
      Load PDF
    */
    async function loadPDF() {

      try {

        const loadingTask =
          pdfjsLib.getDocument(PDF_URL);


        pdf =
          await loadingTask.promise;


        loading.style.display =
          "none";


        totalPagesText.textContent =
          pdf.numPages;


        await renderPDF();


      } catch (error) {

        console.error(
          "PDF.js Error:",
          error
        );


        loading.style.display =
          "none";


        errorBox.style.display =
          "block";


        errorBox.innerHTML =
          "PDF load nahi ho saka.<br><br>" +
          "Please check karo ki <b>/norcet.pdf</b> deployed hai.";

      }

    }


    /*
      Previous page
    */
    prevButton.addEventListener(
      "click",
      () => {

        if (
          !pdf ||
          currentPage <= 1
        ) {
          return;
        }


        currentPage--;


        updatePageInfo();


        const pages =
          document.querySelectorAll("canvas");


        pages[currentPage - 1]?.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }
    );


    /*
      Next page
    */
    nextButton.addEventListener(
      "click",
      () => {

        if (
          !pdf ||
          currentPage >= pdf.numPages
        ) {
          return;
        }


        currentPage++;


        updatePageInfo();


        const pages =
          document.querySelectorAll("canvas");


        pages[currentPage - 1]?.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }
    );


    /*
      Zoom in
    */
    zoomInButton.addEventListener(
      "click",
      async () => {

        if (
          !pdf ||
          scale >= 2.5
        ) {
          return;
        }


        scale += 0.25;


        await renderPDF();

      }
    );


    /*
      Zoom out
    */
    zoomOutButton.addEventListener(
      "click",
      async () => {

        if (
          !pdf ||
          scale <= 0.5
        ) {
          return;
        }


        scale -= 0.25;


        await renderPDF();

      }
    );


    /*
      Start
    */
    loadPDF();

  </script>

</body>
</html>
